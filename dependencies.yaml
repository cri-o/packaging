---
dependencies:
  - name: CRI-O
    version: v1.37
    refPaths:
      - path: README.md
        match: CRIO_VERSION=

  - name: zeitgeist
    version: v0.8.0
    upstream:
      flavour: github
      url: kubernetes-sigs/zeitgeist
    refPaths:
      - path: Makefile
        match: ZEITGEIST_VERSION =

  - name: Kubernetes test version
    version: v1.37
    refPaths:
      - path: test/scripts/versions.sh
        match: ^KUBERNETES_VERSION=
      - path: README.md
        match: KUBERNETES_VERSION=

  - name: OSC
    version: 1.28.0
    upstream:
      flavour: github
      url: openSUSE/osc
    refPaths:
      - path: scripts/helpers
        match: OSC_VERSION=

  - name: Fedora test image
    version: 44
    refPaths:
      - path: test/rpm/Dockerfile
        match: FROM=
      - path: .github/workflows/obs.yml
        match: "- image: fedora"

  - name: CentOS test vagrant image
    version: stream10
    refPaths:
      - path: test/rpm/Vagrantfile
        match: config.vm.box

  - name: Ubuntu test vagrant image
    version: ubuntu-26.04
    refPaths:
      - path: test/deb/Vagrantfile
        match: config.vm.box

  - name: Ubuntu test container image
    version: 26.04
    refPaths:
      - path: test/deb/Dockerfile
        match: FROM=
      - path: .github/workflows/obs.yml
        match: "- image: ubuntu:26"

  - name: Ubuntu previous LTS test container image
    version: 24.04
    refPaths:
      - path: .github/workflows/obs.yml
        match: "- image: ubuntu:24"

  - name: Debian test container image
    version: 13
    refPaths:
      - path: .github/workflows/obs.yml
        match: "- image: debian"

  - name: AlmaLinux test container image
    version: "10"
    refPaths:
      - path: .github/workflows/obs.yml
        match: "- image: almalinux"

  - name: shellcheck
    version: v0.11.0
    upstream:
      flavour: github
      url: koalaman/shellcheck
    refPaths:
      - path: Makefile
        match: SHELLCHECK_VERSION :=

  - name: shellfmt
    version: v3.14.1
    upstream:
      flavour: github
      url: mvdan/sh
    refPaths:
      - path: Makefile
        match: SHFMT_VERSION :=

  - name: mdtoc
    version: v1.4.0
    upstream:
      flavour: github
      url: kubernetes-sigs/mdtoc
    refPaths:
      - path: Makefile
        match: MDTOC_VERSION :=

  - name: actionlint
    version: v1.7.12
    upstream:
      flavour: github
      url: rhysd/actionlint
    refPaths:
      - path: Makefile
        match: ACTIONLINT_VERSION :=

  - name: zizmor
    version: v1.31.1
    upstream:
      flavour: github
      url: zizmorcore/zizmor
    refPaths:
      - path: Makefile
        match: ZIZMOR_VERSION :=

  - name: node image for prettier
    version: 26-alpine
    refPaths:
      - path: Makefile
        match: NODE_IMAGE :=

  - name: prettier
    version: 3.9.10
    upstream:
      flavour: github
      url: prettier/prettier
    refPaths:
      - path: Makefile
        match: PRETTIER_VERSION :=

  - name: krel
    version: v0.22.0
    upstream:
      flavour: github
      url: kubernetes/release
    refPaths:
      - path: scripts/helpers
        match: KREL_VERSION=

  - name: bom
    version: 0.8.0
    upstream:
      flavour: github
      url: kubernetes-sigs/bom
    refPaths:
      - path: .github/workflows/obs.yml
        match: "bom-release: "
      - path: .github/workflows/test.yml
        match: "bom-release: "

  - name: oras
    version: 1.3.6
    upstream:
      flavour: github
      url: oras-project/oras
    refPaths:
      - path: .github/workflows/obs.yml
        match: "version: 1."

  - name: debian base
    version: trixie-v1.0.1
    refPaths:
      - path: test/testdata/container.json
        match: debian-base

  - name: cni-plugins (latest)
    version: v1.9.1
    upstream:
      flavour: github
      url: containernetworking/plugins
    refPaths:
      - path: templates/latest/cri-o/bundle/versions
        match: cni-plugins
      - path: scripts/bundle/digests
        match: '"cni-plugins-'

  - name: conmon (latest)
    version: v2.2.1
    upstream:
      flavour: github
      url: containers/conmon
    refPaths:
      - path: templates/latest/cri-o/bundle/versions
        match: '"conmon"'
      - path: scripts/bundle/digests
        match: '"conmon-v'

  # TODO: remove once CRI-O v1.36 goes EOL
  - name: conmon-rs (CRI-O <= v1.36)
    version: v0.8.0
    refPaths:
      - path: templates/latest/cri-o/bundle/versions
        match: '"conmon-rs"]=v0'
      - path: scripts/bundle/digests
        match: '"conmon-rs-v0'

  - name: conmon-rs (CRI-O >= v1.37)
    version: v1.2.1
    upstream:
      flavour: github
      url: containers/conmon-rs
    refPaths:
      - path: templates/latest/cri-o/bundle/versions
        match: '"conmon-rs"]=v1'
      - path: scripts/bundle/digests
        match: '"conmon-rs-v1'

  - name: cri-tools (latest)
    version: v1.37.0
    upstream:
      flavour: github
      url: kubernetes-sigs/cri-tools
    refPaths:
      - path: templates/latest/cri-o/bundle/versions
        match: cri-tools
      - path: scripts/bundle/digests
        match: '"cri-tools-'

  - name: runc (latest)
    version: v1.5.2
    upstream:
      flavour: github
      url: opencontainers/runc
    refPaths:
      - path: templates/latest/cri-o/bundle/versions
        match: runc
      - path: scripts/bundle/digests
        match: '"runc-'

  - name: crun (latest)
    version: 1.30.1
    upstream:
      flavour: github
      url: containers/crun
    refPaths:
      - path: templates/latest/cri-o/bundle/versions
        match: crun
      - path: scripts/bundle/digests
        match: '"crun-'

  - name: crio-credential-provider (latest)
    version: v0.1.2
    upstream:
      flavour: github
      url: cri-o/crio-credential-provider
    refPaths:
      - path: templates/latest/cri-o/bundle/versions
        match: crio-credential-provider
      - path: scripts/bundle/digests
        match: '"crio-credential-provider-'
