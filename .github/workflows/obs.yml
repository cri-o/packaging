name: obs
on:
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        default: main
        description: Branch or Tag to be published
        type: string
      skip-bundles:
        default: false
        description: Skip bundling and only stage+test+release
        type: boolean
      skip-stage:
        default: false
        description: Skip staging and only bundles+test+release
        type: boolean
      skip-tests:
        default: false
        description: Skip testing and only bundles+stage+release
        type: boolean
      skip-release:
        default: false
        description: Skip releasing and only bundles+stage+test
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.revision || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REVISION: ${{ inputs.revision || 'main' }}
  OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}

run-name: publish on OBS / ${{ inputs.revision || 'main' }}

jobs:
  vars:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      archive_path: ${{ steps.step.outputs.ARCHIVE_PATH }}
      commit: ${{ steps.step.outputs.COMMIT }}
      git_root: ${{ steps.step.outputs.GIT_ROOT }}
      project: ${{ steps.step.outputs.PROJECT }}
      project_type: ${{ steps.step.outputs.PROJECT_TYPE }}
      project_version: ${{ steps.step.outputs.PROJECT_VERSION }}
      version: ${{ steps.step.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: step
        run: |
          source scripts/vars
          {
            echo "ARCHIVE_PATH=$ARCHIVE_PATH"
            echo "COMMIT=$COMMIT"
            echo "GIT_ROOT=$GIT_ROOT"
            echo "PROJECT=$PROJECT"
            echo "PROJECT_TYPE=$PROJECT_TYPE"
            echo "PROJECT_VERSION=$PROJECT_VERSION"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: COMMIT=${{ steps.step.outputs.commit }}
        run: true

  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env: &vars
      ARCHIVE_PATH: ${{ needs.vars.outputs.archive_path }}
      COMMIT: ${{ needs.vars.outputs.commit }}
      GIT_ROOT: ${{ needs.vars.outputs.git_root }}
      PROJECT: ${{ needs.vars.outputs.project }}
      PROJECT_TYPE: ${{ needs.vars.outputs.project_type }}
      PROJECT_VERSION: ${{ needs.vars.outputs.project_version }}
      VERSION: ${{ needs.vars.outputs.version }}
    needs: vars
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - ppc64le
          - s390x
    name: bundle / build / ${{ inputs.revision || 'main' }} / ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: kubernetes-sigs/release-actions/setup-bom@b5b8280a60e6e20607f77068011269b982c60971 # v0.4.5
        if: ${{ inputs.skip-bundles == false }}
        with:
          bom-release: 0.8.0
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        if: ${{ inputs.skip-bundles == false }}
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          command: scripts/bundle/build
        env:
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.skip-bundles == false }}
        with:
          name: bundles-${{ matrix.arch }}
          path: build/bundle/*.tar.gz*

  bundle-test:
    name: bundle / test / ${{ inputs.revision || 'main' }} / amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *vars
    needs:
      - vars
      - bundles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.skip-bundles == false }}
        with:
          name: bundles-amd64
          path: build/bundle
      - run: sudo --preserve-env=ARCHIVE_PATH,COMMIT,GIT_ROOT,PROJECT,PROJECT_TYPE,PROJECT_VERSION,VERSION scripts/bundle/test
        if: ${{ inputs.skip-bundles == false }}

  bundles-publish:
    name: bundles / publish / ${{ inputs.revision || 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: *vars
    needs:
      - vars
      - bundle-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          credentials_json: ${{ secrets.GCS_CRIO_SA }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
      - uses: kubernetes-sigs/release-actions/setup-tejolote@b5b8280a60e6e20607f77068011269b982c60971 # v0.4.5
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          pattern: bundles-*
          merge-multiple: true
          path: build/bundle
      - run: scripts/vex
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
      - run: scripts/provenance
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: scripts/sign-artifacts
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
      - run: scripts/verify-artifacts
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          path: build/bundle
          destination: cri-o/artifacts
          parent: false
          process_gcloudignore: false
      - name: Create bundle marker
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        # REVISION comes from the workflow env, interpolating the input into the
        # script itself would allow it to inject shell code
        run: find . -type f -iname "cri-o.amd64.*.tar.gz" | sed -n 's;.*amd64.\(.*\).tar.gz;\1;p' > "latest-bundle-$REVISION.txt"
      - name: Upload bundle marker
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          path: latest-bundle-${{ inputs.revision || 'main' }}.txt
          destination: cri-o
          process_gcloudignore: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          name: signatures
          path: |
            build/bundle/*.sig
            build/bundle/*.cert
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          name: attestations
          path: |
            build/bundle/*.openvex.json
            build/bundle/*.provenance.json

  oci-artifacts-publish:
    name: oci-artifacts / publish / ${{ inputs.revision || 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: *vars
    needs:
      - vars
      - bundles-publish
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io/cri-o
          username: cri-o
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
      - uses: kubernetes-sigs/release-actions/setup-bom@b5b8280a60e6e20607f77068011269b982c60971 # v0.4.5
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          bom-release: 0.8.0
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          version: 1.3.6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          pattern: bundles-*
          merge-multiple: true
          path: build/bundle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}
        with:
          name: attestations
          path: build/bundle
      - run: scripts/oci-artifacts
        if: ${{ inputs.skip-bundles == false && github.event_name != 'pull_request' }}

  stage:
    runs-on: ubuntu-latest
    env: *vars
    name: stage / ${{ inputs.revision || 'main' }}
    timeout-minutes: 240
    needs:
      - vars
      - bundles-publish
      - oci-artifacts-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/obs
        if: ${{ inputs.skip-stage == false && github.event_name != 'pull_request' }}

  test-kubernetes:
    runs-on: ubuntu-latest
    env: *vars
    timeout-minutes: 120
    needs:
      - vars
      - stage
    strategy:
      fail-fast: false
      matrix:
        type:
          - deb
          - rpm
    name: test / ${{ matrix.type }} / kubernetes / amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo scripts/github-actions-setup
        if: ${{ inputs.skip-tests == false && github.event_name != 'pull_request' }}
      - run: sudo --preserve-env=TYPE,ARCHIVE_PATH,COMMIT,GIT_ROOT,PROJECT,PROJECT_TYPE,PROJECT_VERSION,VERSION scripts/test-kubernetes
        if: ${{ inputs.skip-tests == false && github.event_name != 'pull_request' }}
        env:
          TYPE: ${{ matrix.type }}

  test-architectures:
    runs-on: ubuntu-latest
    env: *vars
    timeout-minutes: 120
    needs:
      - vars
      - stage
    strategy:
      fail-fast: false
      matrix:
        run:
          - image: almalinux:10
            type: rpm
          - image: fedora:44
            type: rpm
          - image: debian:13
            type: deb
          - image: ubuntu:24.04
            type: deb
          - image: ubuntu:26.04
            type: deb
        arch:
          - amd64
          - arm64
          - ppc64le
          - s390x
        exclude:
          - run:
              image: almalinux:10
            arch: s390x # QEMU emulation segfault
          - run:
              image: fedora:44
            arch: s390x # QEMU emulation segfault
    name: test / ${{ matrix.run.type }} / ${{ matrix.run.image }} / ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ inputs.skip-tests == false && github.event_name != 'pull_request' }}
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        if: ${{ inputs.skip-tests == false && github.event_name != 'pull_request' }}
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        if: ${{ inputs.skip-tests == false && github.event_name != 'pull_request' }}
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          command: scripts/test-architectures
        env:
          IMAGE: ${{ matrix.run.image }}
          ARCH: ${{ matrix.arch }}
          TYPE: ${{ matrix.run.type }}

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: *vars
    name: release / ${{ inputs.revision || 'main' }}
    needs:
      - vars
      - test-architectures
      - test-kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/obs
        if: ${{ inputs.skip-release == false && github.event_name != 'pull_request' }}
        env:
          RUN_RELEASE: 1
